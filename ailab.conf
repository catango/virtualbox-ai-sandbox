# ailab configuration - sourced by all ailab-*.sh scripts.
# Override any value by exporting it or by creating ./ailab.local.conf next to this file.

# --- VM sizing (tuned for 16 GB RAM / 4 core older Intel host) ---------------
VM_NAME="ailab"
VM_CPUS=2              # leave 2 cores to the host
VM_RAM_MB=4096         # leave ~12 GB to the host
VM_DISK_MB=40960       # dynamic VDI, only grows as used

# --- Access ------------------------------------------------------------------
SSH_BIND="127.0.0.1"   # host interface the NAT port-forward listens on
SSH_PORT=3333          # host port -> guest 22
WORK_USER="claude"     # Claude Code workspace user (no sudo)
ADMIN_USER="ailab"     # admin user (sudo), for maintenance only

# --- Guest identity ----------------------------------------------------------
GIT_USER_NAME="ailab"
GIT_USER_EMAIL="ailab@users.noreply.github.com"   # use your GitHub noreply address
TIMEZONE="UTC"

# --- Tool versions (empty = latest release at provisioning time, checksum verified)
TOFU_VERSION=""
TFLINT_VERSION=""

# --- Base image (Debian 13 "trixie" generic cloud image; "generic" not "genericcloud": full kernel drivers for VirtualBox) ----------------------
IMG_BASE_URL="https://cloud.debian.org/images/cloud/trixie/latest"
IMG_NAME="debian-13-generic-amd64.qcow2"

# --- Local state (cache, SSH key, VM files) ----------------------------------
STATE_DIR="${AILAB_STATE_DIR:-$HOME/.ailab}"
SNAPSHOT_NAME="clean"

# --- Host boot/shutdown integration (VirtualBox autostart / autostop) --------
AUTOSTART="yes"        # set the VM's autostart + ACPI-autostop flags (host side enabled via ailab-autostart.sh)
AUTOSTART_DELAY=15     # seconds after host boot before the VM starts
